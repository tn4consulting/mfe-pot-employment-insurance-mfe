# Shared static-SPA nginx config for every mfe-pot frontend container.
# Mirrors the header/caching behaviour the old firebase.json defined per
# app (see CLAUDE.md's Hosting section): env.js and remoteEntry.json must
# never be cached (a redeploy needs to take effect immediately), hashed
# js/css chunks are safe to cache forever, and remoteEntry.json needs CORS
# since other apps' origins fetch it directly as a federation remote.
#
# Only the federation-shared vendor chunks are actually content-hashed --
# always suffixed `-dev.js` by deliberate design (every app's build.mjs
# forces dev:true on the federation build step to dodge a minifier bug,
# see CLAUDE.md's federation section -- the -dev.js suffix is the accepted
# cosmetic cost of that fix, and doubles as a reliable "this file is really
# hashed" marker). An app's OWN bundles -- main.js/main.css and every
# federation-exposed module (Component.js, PaymentHistoryWidget.js, etc.)
# -- are never hashed (fixed filenames every build, confirmed against a
# real dist output) and must not get the same immutable-forever treatment,
# or a browser that's ever loaded the app keeps serving pre-redeploy code
# indefinitely -- confirmed live: this is exactly what happened debugging
# why a new feature flag's second variant never appeared in a real browser
# tab. Matched via location-block order below (nginx tests regex locations
# in file order, first match wins), not by trying to distinguish them in a
# single combined regex.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # env.js needs CORS too, same reason as remoteEntry.json below: a
    # federated remote fetches its OWN env.js cross-origin at module-init
    # time (shared-runtime-config's fetchRuntimeConfig -- window.__mfePotEnv
    # only carries the host's values once federated, not this remote's own).
    # This exact-match block doesn't inherit the .js regex block's CORS
    # header below it -- nginx picks the most specific match, and `=` beats
    # `~*` regardless of order -- so it needs its own copy.
    location = /env.js {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /remoteEntry.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Must appear before the general .js/.css block below -- nginx picks
    # the first matching regex location in file order, not the most
    # specific one. Only the federation-shared vendor chunks match this
    # (see the file-level comment above); safe to cache forever since a
    # content change always produces a new -dev.js filename.
    location ~* -dev\.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Everything else ending in .js/.css -- an app's own main.js/main.css
    # and every federation-exposed module -- is never hashed, so it must
    # revalidate on every load (no-cache), same posture as env.js/
    # remoteEntry.json above and for the identical reason: a redeploy
    # needs to take effect immediately, not after a year.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Real gotcha caught the hard way: a remote's own Transloco instance
    # fetches its i18n JSON from its own origin (by design -- see
    # CLAUDE.md's i18n section), which is a cross-origin request the
    # moment that remote is actually federated into another app's page.
    # The .js/.css rule above doesn't match .json, so this was silently
    # falling through to the generic location block below with no CORS
    # header at all -- worked fine curled in isolation, broke the instant
    # shell genuinely loaded a remote in a real browser (a
    # TranslocoLoadError, not an obviously-CORS-shaped failure at first
    # glance). Every static asset under /assets/ needs the same treatment
    # as remoteEntry.json, not just the two file types apps happen to
    # import as JS modules.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
