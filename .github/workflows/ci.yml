name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets mfe-pot/tools/deploy-eks.sh re-trigger this repo's deploy-eks job
  # on demand (e.g. right after a fresh cluster comes up) without needing
  # a new commit -- Stage 2 otherwise only fires on a push to main.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.0'
  PNPM_VERSION: '10.33.2'

permissions:
  contents: read
  packages: read

jobs:
  # Stage 1: lint/test/build, matching `nx run-many -t lint,test,build --all`
  # from local dev (see CLAUDE.md). @tn4consulting/* resolves from GitHub
  # Packages via .npmrc; GITHUB_TOKEN works for same-org package reads.
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      # Catches Native-Federation-shared-singleton drift (react/react-dom/
      # shared-ui-scds-core/shared-federation-runtime/shared-federation-config
      # vs mfe-pot-platform/platform-versions.json) before it becomes a
      # silent runtime failure -- see
      # mfe-pot/docs/plans/20260808-1200-multi-team-scale-governance.md.
      # --check-critical-prs needs gh authenticated; GITHUB_TOKEN covers
      # read-only PR listing on this repo with no extra secret.
      - name: Check platform-versions.json alignment
        run: pnpm run check:versions -- --check-critical-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint, test, build
        run: pnpm exec nx run-many -t lint,test,build --all

      # employment-insurance-bff's lint target is inferred as
      # `eslint:lint`, not `lint` (the @nx/node generator doesn't add an
      # explicit `lint` target the way the Angular app does) -- see
      # CLAUDE.md's "Backends: BFF pattern" section. `nx run-many -t
      # lint` above silently skips it.
      - name: Lint employment-insurance-bff
        run: pnpm exec nx run employment-insurance-bff:eslint:lint

  # Stage 2: build both images, deploy this app's own Helm chart to an
  # ephemeral kind cluster, and confirm it actually serves -- the
  # kind-based validation stage from CLAUDE.md's Hosting section, now
  # automated instead of the one-off manual run it started as.
  kind-validation:
    needs: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: mfe-pot-employment-insurance-mfe

      # charts/employment-insurance-mfe/Chart.yaml's library-chart
      # dependencies resolve via a sibling-checkout-relative file:// path
      # (see CLAUDE.md) -- checked out alongside this repo so the same
      # relative layout local dev uses (both under one parent directory)
      # holds here too. Public repo, so the default GITHUB_TOKEN reads it
      # with no extra secret.
      - name: Checkout mfe-pot-platform (sibling - Helm library charts + kind config)
        uses: actions/checkout@v4
        with:
          repository: tn4consulting/mfe-pot-platform
          path: mfe-pot-platform

      - uses: docker/setup-buildx-action@v3

      - name: Build employment-insurance-mfe image
        uses: docker/build-push-action@v6
        with:
          context: mfe-pot-employment-insurance-mfe
          file: mfe-pot-employment-insurance-mfe/apps/employment-insurance-mfe/Dockerfile
          tags: mfe-pot-employment-insurance-mfe:kind
          load: true
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      - name: Build employment-insurance-bff image
        uses: docker/build-push-action@v6
        with:
          context: mfe-pot-employment-insurance-mfe
          file: mfe-pot-employment-insurance-mfe/apps/employment-insurance-bff/Dockerfile
          tags: mfe-pot-employment-insurance-bff:kind
          load: true
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      # Pinned node image: this environment's Docker daemon (cgroup v1)
      # can't kubeadm-init kind's current default node image (built for
      # k8s 1.36) -- see CLAUDE.md. Kept pinned here too for consistency
      # with the proven local recipe, even though GitHub-hosted runners
      # typically run cgroup v2 and may not need the pin.
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          config: mfe-pot-platform/tools/k8s/kind-config.yaml
          node_image: kindest/node:v1.27.3
          wait: 120s

      - name: Install ingress-nginx (kind flavour)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Load images into kind
        run: |
          kind load docker-image mfe-pot-employment-insurance-mfe:kind
          kind load docker-image mfe-pot-employment-insurance-bff:kind

      - uses: azure/setup-helm@v4

      - name: helm dependency update
        run: helm dependency update mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe

      - name: helm install employment-insurance-mfe
        run: |
          helm install employment-insurance-mfe mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe \
            -f mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe/values.yaml \
            -f mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe/values-kind.yaml \
            --wait --timeout 120s

      # Same checks proven manually (see CLAUDE.md/the platform repo's
      # plan doc): the frontend actually serves, the ConfigMap-injected
      # runtime config round-tripped (not the image's {} placeholder),
      # and the BFF is reachable through the same Ingress via /api. Hits
      # /api/claims with no query param deliberately -- asserts a real
      # 400 validation-error response (not a 404), proving the request
      # actually reached the Express app rather than just testing
      # infra-level routing existence.
      - name: Verify the deployed app is actually reachable
        run: |
          set -eu
          # helm install --wait only waits for the pod to be Ready, not for
          # ingress-nginx's own reconciliation loop to pick up the new
          # Ingress resource -- give it a few seconds before asserting.
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: employment-insurance-mfe.mfe-pot.local" http://localhost/ || echo 000)
            [ "$status" = "200" ] && break
            sleep 2
          done
          curl -sf -H "Host: employment-insurance-mfe.mfe-pot.local" http://localhost/ | grep -qi '<script src="env.js">'
          curl -sf -H "Host: employment-insurance-mfe.mfe-pot.local" http://localhost/env.js | grep -q '"employmentInsuranceBffBaseUrl":""'
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: employment-insurance-mfe.mfe-pot.local" "http://localhost/api/claims")
          [ "$status" = "400" ]

  # Stage 2: build+push real images to ECR and deploy to the real AWS EKS
  # cluster, on push to main only. See
  # mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md for the
  # full design. The demo cluster is intentionally torn down between demos
  # (cost-conscious PoC) -- most pushes to main happen while it doesn't
  # exist, so every step past the liveness check is individually gated on
  # `steps.check.outputs.cluster_up` rather than skipping the whole job.
  deploy-eks:
    needs: [lint-test-build, kind-validation]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: mfe-pot-employment-insurance-mfe

      - name: Checkout mfe-pot-platform (sibling - Helm library charts)
        uses: actions/checkout@v4
        with:
          repository: tn4consulting/mfe-pot-platform
          path: mfe-pot-platform

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push employment-insurance-mfe image
        if: steps.check.outputs.cluster_up == 'true'
        uses: docker/build-push-action@v6
        with:
          context: mfe-pot-employment-insurance-mfe
          file: mfe-pot-employment-insurance-mfe/apps/employment-insurance-mfe/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/mfe-pot-employment-insurance-mfe:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      - name: Build and push employment-insurance-bff image
        if: steps.check.outputs.cluster_up == 'true'
        uses: docker/build-push-action@v6
        with:
          context: mfe-pot-employment-insurance-mfe
          file: mfe-pot-employment-insurance-mfe/apps/employment-insurance-bff/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/mfe-pot-employment-insurance-bff:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      - name: Update kubeconfig
        if: steps.check.outputs.cluster_up == 'true'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: steps.check.outputs.cluster_up == 'true'

      - name: helm dependency update
        if: steps.check.outputs.cluster_up == 'true'
        run: helm dependency update mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe

      - name: helm upgrade --install against EKS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          helm upgrade --install employment-insurance-mfe mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe \
            -f mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe/values.yaml \
            -f mfe-pot-employment-insurance-mfe/charts/employment-insurance-mfe/values-eks.yaml \
            --set frontend.image.tag=${{ github.sha }} \
            --set backend.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      - name: Verify the deployed app is actually reachable over HTTPS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://employment-insurance-mfe.aws.tn4consulting.com/ || echo 000)
            [ "$status" = "200" ] && break
            sleep 5
          done
          curl -skf https://employment-insurance-mfe.aws.tn4consulting.com/ | grep -qi '<script src="env.js">'
