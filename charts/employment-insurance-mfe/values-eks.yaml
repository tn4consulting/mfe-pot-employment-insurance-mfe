# Overrides layered on top of values.yaml for a real AWS EKS deployment (see
# mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md). See
# mfe-pot-job-bank-mfe/charts/job-bank-mfe/values-eks.yaml for the fuller
# explanatory comments this pattern was worked out against first.

frontend:
  # 2 replicas + a real PDB on EKS -- kind stays at 1 (values.yaml) to
  # limit resource pressure on a single-node dev cluster. See
  # mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: 147318891438.dkr.ecr.ca-central-1.amazonaws.com/mfe-pot-employment-insurance-mfe
    pullPolicy: IfNotPresent
  runtimeConfig:
    strapiBaseUrl: "https://cms.aws.tn4consulting.com"
    otelExporterOtlpEndpoint: "https://otel.aws.tn4consulting.com"

backend:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: 147318891438.dkr.ecr.ca-central-1.amazonaws.com/mfe-pot-employment-insurance-bff
    pullPolicy: IfNotPresent
  # REDIS_URL/MOCK_IDP_JWKS_URL/MOCK_IDP_ISSUER/OTEL_EXPORTER_OTLP_ENDPOINT
  # stay unchanged from values.yaml -- real in-cluster Service DNS names,
  # identical on EKS and kind.

ingress:
  host: employment-insurance-mfe.aws.tn4consulting.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
